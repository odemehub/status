# Upptime ayar dosyası
# Bu dosyayı GitHub'daki Upptime reposunun kök dizinindeki .upptimerc.yml ile değiştir.
# "DEGISTIR" yazan her yeri kendi bilgilerinle güncelle.
# Doküman: https://upptime.js.org/docs/configuration

owner: odemehub # GitHub organizasyonu
repo: status # Upptime reposunun adı
user-agent: odemehub

# Bakım (maintenance) issue'larında expectedDown'da bu slug'ları kullanacaksın.
sites:
  # Laravel'in /up sağlık ucu: uygulama ayaktaysa 200 + "Application up" döner
  - name: Ödeme API
    slug: api
    url: https://app.odemehub.com/up
    maxResponseTime: 3000 # 3 sn'den yavaşsa "degraded" (yavaş) görünür
    __dangerous__body_down_if_text_missing: "Application up"

  - name: Merchant Panel
    slug: merchant-panel
    url: https://app.odemehub.com/login
    maxResponseTime: 5000

  - name: Sandbox
    slug: sandbox
    url: https://sandbox.odemehub.com/up
    maxResponseTime: 5000
    __dangerous__body_down_if_text_missing: "Application up"

  - name: Website
    slug: website
    url: https://odemehub.com
    maxResponseTime: 5000

  # TCP portu kontrolü örneği (ör. veritabanı / SFTP):
  # - name: Veritabanı
  #   slug: veritabani
  #   check: "tcp-ping"
  #   url: db.example.com
  #   port: 5432

# Kesinti issue'larının atanacağı GitHub kullanıcıları (opsiyonel)
# assignees:
#   - DEGISTIR-github-kullanici

# Sadece kullandığın secret'ları listele (GH_PAT burada yazılmaz).
# Bildirim kurmazsan bu liste boş kalabilir: secrets: []
secrets:
  - NOTIFICATION_TELEGRAM
  - NOTIFICATION_TELEGRAM_BOT_KEY
  - NOTIFICATION_TELEGRAM_CHAT_ID

# 15 dk'dan kısa süren kesintilerin issue'ları silinmesin, geçmişte görünsün
skipDeleteIssues: true

status-website:
  cname: status.odemehub.com # DNS: status CNAME odemehub.github.io
  name: ödemehub Status
  logoUrl: https://odemehub.com/wp-content/uploads/2026/09/odemehub-primary-logo-300x67.png
  favicon: https://odemehub.com/wp-content/uploads/2026/09/cropped-odemehub-favicon-192x192.png
  theme: light # light, dark, night, ocean
  introTitle: "**ödemehub** servis durumu"
  introMessage: >-
    Bu sayfa ödemehub servislerinin anlık durumunu gösterir.
    Kesinti ve planlı bakımlar burada duyurulur.
  navbar:
    - title: Durum
      href: /
    - title: ödemehub.com
      href: https://odemehub.com

